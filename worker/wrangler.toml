# Cloudflare Worker — nvnest.com edge logic
# Deploy from this directory:  wrangler deploy

name = "nvnest-edge"
main = "blog-proxy.js"
compatibility_date = "2026-10-01"

# Routes on the nvnest.com zone. More specific routes win, so /blog on the apex
# is proxied while everything on www is 301-redirected to the apex.
# NOTE: keep this as a top-level key (before [vars]) — inside [vars] it is
# parsed as an environment variable and no routes are attached.
routes = [
  { pattern = "nvnest.com/blog*", zone_name = "nvnest.com" },
  { pattern = "www.nvnest.com/*", zone_name = "nvnest.com" }
]

[vars]
# Blog Pages project production host.
BLOG_ORIGIN = "nvnest-blog.pages.dev"
