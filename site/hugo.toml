baseURL = "/"
languageCode = "en-us"
title = "Kaldi"
theme = "hextra"
# The hextra theme lives in a git submodule at the repo root (../themes relative to this site directory)
themesDir = "../themes"

# Enable required HTML rendering for Hextra shortcodes
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

# Hextra Parameters
[params]
  [params.search]
    enable = true
    type = "flexsearch"

  [params.editURL]
    enable = false

# Navigation Menu
[[menu.main]]
  name = "Blog"
  pageRef = "/post"
  weight = 1

[[menu.main]]
  name = "About"
  pageRef = "/contact"
  weight = 2