baseURL = "/"
languageCode = "en-us"
title = "Nvnest"
theme = "paper"
# Themes live in git submodules at the repo root (../themes relative to this site directory)
themesDir = "../themes"

enableRobotsTXT = true
enableInlineShortcodes = true

# Sections listed on the home page blog roll (Paper reads site.Params.mainSections)
mainSections = ["post"]

# Enable required HTML rendering for Markdown content
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Paper pagination
[pagination]
  pagerSize = 100

[params]
  description = ""
  color = "linen"
  name = ""
  logo = ""
  bio = ""

[taxonomies]
  tag = "tags"

# Paper navigation menu
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/post/"
    weight = 10
