# Full final URL where the blog is served, so Hugo emits absolute links
# (canonical, OG, sitemap, RSS, css/js/img) on https://nvnest.com/blog/.
# The trailing slash is REQUIRED.
#
# Do NOT use "/" or "https://nvnest.com/": those emit root-relative URLs
# that would point at nvnest.com itself — outside the /blog/* proxy rule —
# breaking every post link, stylesheet, and image on the landing site.
# The blog repo publishes at the ROOT of silly-pothos.../; the landing
# page's /blog -> site proxy strips "/blog" and maps the splat to that root,
# so baseURL here must be the public nvnest.com/blog address.
baseURL = "https://nvnest.com/blog/"
languageCode = "en-us"
title = "Nvnest"
theme = "paper"
# Themes live in git submodules at the repo root (../themes relative to this site directory)
themesDir = "../themes"

enableRobotsTXT = true
enableInlineShortcodes = true

# Sections listed on the home page blog roll (Paper reads site.Params.mainSections)
mainSections = ["post"]

# Enable required HTML rendering for Markdown content
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Paper pagination
[pagination]
  pagerSize = 100

[params]
  description = ""
  color = "linen"
  name = ""
  logo = ""
  bio = ""

[taxonomies]
  tag = "tags"

# Paper navigation menu
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/post/"
    weight = 10
