# Full final URL where the blog is served, so Hugo emits absolute links
# (canonical, OG, sitemap, RSS, css/js/img) on https://nvnest.com/blog/.
# The trailing slash is REQUIRED.
#
# Do NOT use "/" or "https://nvnest.com/": those emit root-relative URLs
# that would point at nvnest.com itself — outside the /blog/* proxy rule —
# breaking every post link, stylesheet, and image on the landing site.
# The blog repo publishes at the ROOT of silly-pothos.../; the landing
# page's /blog -> site proxy strips "/blog" and maps the splat to that root,
# so baseURL here must be the public nvnest.com/blog address.
baseURL = "https://nvnest.com/blog/"
languageCode = "en-us"
title = "Nvnest"
theme = "paper"
# Themes live in git submodules at the repo root (../themes relative to this site directory)
themesDir = "../themes"

enableRobotsTXT = true
enableInlineShortcodes = true

# Sections listed on the home page blog roll (Paper reads site.Params.mainSections)
mainSections = ["post"]

# Enable required HTML rendering for Markdown content
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Paper pagination
[pagination]
  pagerSize = 100

[params]
  # Site-wide description. Used as the home page <meta name="description">,
  # the home page intro paragraph, and the llms.txt summary. Keep under ~160 chars.
  description = "Practical guides on invoice automation, accounts payable data extraction, and verifying AI-extracted document data for finance and procurement teams."
  color = "linen"
  name = ""
  logo = ""
  bio = ""

  # Byline shown on posts and used as the fallback author. The publisher is the
  # organization (Organization JSON-LD) — set a real person here only if posts
  # get an explicit `author` in frontmatter.
  author = "Nvnest"

  # GEO/AEO: keyword-bearing <h1> for the blog home page.
  homeHeading = "Invoice Automation and Document Extraction Guides"

  # GEO/AEO: the single canonical definition of the product. Repeated verbatim
  # across every post CTA, /about/, llms.txt and the Organization JSON-LD so
  # answer engines learn ONE consistent entity definition ("Nvnest = document
  # data extraction") instead of several competing ones.
  slogan = "Turn documents into verified data"
  organizationDescription = "Nvnest turns documents into verified data. Upload invoices and business documents — Nvnest extracts the fields you need, shows you exactly where each value came from, and lets your team review before it moves into your workflow."

  # GEO/AEO: public identity of the publishing organization (emitted as JSON-LD
  # Organization on every page).
  organizationURL = "https://nvnest.com"
  organizationLogo = "img/logo.svg"

  # GEO/AEO: authoritative profiles for entity grounding (Organization.sameAs).
  # Uncomment and fill in when known:
  # sameAs = ["https://www.linkedin.com/company/nvnest"]

[taxonomies]
  tag = "tags"

# Paper navigation menu
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/post/"
    weight = 10

# GEO/AEO: publish /llms.txt alongside the HTML home page so LLM crawlers get a
# compact, curated map of the site. Rendered by layouts/index.llms.txt.
[outputs]
  home = ["HTML", "RSS", "llms"]

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true
