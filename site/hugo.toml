baseURL = "/"
languageCode = "en-us"
title = "Kaldi"
theme = "hextra"

# Enable markup features required by Hextra (like search and code highlighting)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[params]
  # Navbar search bar
  search = true

  # FlexSearch options
  [params.search]
    enable = true
    type = "flexsearch"

  # Page header edit link
  [params.editURL]
    enable = false

# Main Top Navigation Menu
[[menu.main]]
  name = "Blog"
  pageRef = "/post"
  weight = 1

[[menu.main]]
  name = "About"
  pageRef = "/contact"
  weight = 2