baseURL = "/"
languageCode = "en-us"
title = "Kaldi"
theme = "paper"
# Themes live in git submodules at the repo root (../themes relative to this site directory)
themesDir = "../themes"

enableRobotsTXT = true
enableInlineShortcodes = true

# Sections listed on the home page blog roll (Paper reads site.Params.mainSections)
mainSections = ["post"]

# Enable required HTML rendering for Markdown content
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Paper pagination
[pagination]
  pagerSize = 3

[params]
  description = "Kaldi is the coffee store for everyone who believes that great coffee shouldn't just taste good, it should do good too."
  color = "linen"
  name = "Kaldi"
  bio = "Great coffee with a conscience"

[taxonomies]
  tag = "tags"

# Paper navigation menu
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/post/"
    weight = 10

  [[menu.main]]
    identifier = "products"
    name = "Products"
    url = "/products/"
    weight = 20

  [[menu.main]]
    identifier = "values"
    name = "Values"
    url = "/values/"
    weight = 30

  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 40
